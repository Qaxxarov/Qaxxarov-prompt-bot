<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro AI — Kontent Kalendar</title>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.9/index.global.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1117;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 1.5rem;
            color: #6366f1;
        }
        .legend {
            display: flex;
            gap: 15px;
            font-size: 0.85rem;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot-posted { background: #10b981; }
        .dot-planned { background: #f59e0b; }
        .dot-missed { background: #ef4444; }
        #calendar {
            background: #1a1d27;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #2d3748;
        }
        .fc {
            --fc-border-color: #2d3748;
            --fc-button-bg-color: #6366f1;
            --fc-button-border-color: #6366f1;
            --fc-button-hover-bg-color: #4f46e5;
            --fc-button-hover-border-color: #4f46e5;
            --fc-button-active-bg-color: #4338ca;
            --fc-today-bg-color: rgba(99, 102, 241, 0.1);
            --fc-event-bg-color: #6366f1;
            --fc-page-bg-color: transparent;
            --fc-neutral-bg-color: #1e2130;
        }
        .fc .fc-toolbar-title { color: #e2e8f0; font-size: 1.2rem; }
        .fc .fc-col-header-cell-cushion { color: #94a3b8; }
        .fc .fc-daygrid-day-number { color: #cbd5e1; }
        .fc-event {
            border-radius: 4px;
            padding: 2px 4px;
            font-size: 0.75rem;
            border: none !important;
        }
        .event-posted { background-color: #10b981 !important; }
        .event-planned { background-color: #f59e0b !important; color: #000 !important; }
        .event-missed { background-color: #ef4444 !important; }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #1a1d27;
            border-radius: 12px;
            padding: 24px;
            width: 90%;
            max-width: 400px;
            border: 1px solid #2d3748;
        }
        .modal h3 { margin-bottom: 16px; color: #6366f1; }
        .modal input, .modal select, .modal textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            background: #0f1117;
            border: 1px solid #2d3748;
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 0.9rem;
        }
        .modal textarea { min-height: 80px; resize: vertical; }
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .btn-primary { background: #6366f1; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-secondary { background: #374151; color: #e2e8f0; }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📅 Kontent Kalendar</h1>
        <div class="legend">
            <div class="legend-item"><div class="legend-dot dot-posted"></div> Post qilingan</div>
            <div class="legend-item"><div class="legend-dot dot-planned"></div> Rejada</div>
            <div class="legend-item"><div class="legend-dot dot-missed"></div> O'tkazib yuborilgan</div>
        </div>
    </div>

    <div id="calendar"></div>

    <!-- Add/Edit Modal -->
    <div class="modal-overlay" id="eventModal">
        <div class="modal">
            <h3 id="modalTitle">📅 Yangi Event</h3>
            <input type="text" id="eventTitle" placeholder="Sarlavha (masalan: Pomidor haqida reel)">
            <input type="date" id="eventDate">
            <input type="time" id="eventTime" value="19:00">
            <select id="eventStatus">
                <option value="planned">🟡 Rejada</option>
                <option value="posted">✅ Post qilingan</option>
                <option value="missed">🔴 O'tkazib yuborilgan</option>
            </select>
            <textarea id="eventNotes" placeholder="Izoh (ixtiyoriy)"></textarea>
            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="saveEvent()">💾 Saqlash</button>
                <button class="btn btn-danger" id="deleteBtn" style="display:none" onclick="deleteEvent()">🗑 O'chirish</button>
                <button class="btn btn-secondary" onclick="closeModal()">❌ Bekor</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.9/index.global.min.js"></script>
    <script>
        const API_BASE = window.location.origin;
        let calendar;
        let editingEventId = null;

        // Auth token
        function getToken() {
            return localStorage.getItem('agro_token') || '';
        }

        function headers() {
            return {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + getToken()
            };
        }

        // Initialize calendar
        document.addEventListener('DOMContentLoaded', function() {
            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'uz',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,dayGridWeek'
                },
                dateClick: function(info) {
                    openModal(null, info.dateStr);
                },
                eventClick: function(info) {
                    openModal(info.event);
                },
                events: fetchEvents,
                eventClassNames: function(arg) {
                    const status = arg.event.extendedProps.status || 'planned';
                    return ['event-' + status];
                }
            });
            calendar.render();
        });

        async function fetchEvents(info, successCallback, failureCallback) {
            try {
                const res = await fetch(API_BASE + '/api/calendar?start=' + info.startStr + '&end=' + info.endStr, {
                    headers: headers()
                });
                if (!res.ok) {
                    failureCallback(new Error('Auth error'));
                    return;
                }
                const data = await res.json();
                const events = (data.events || []).map(e => ({
                    id: e.id,
                    title: e.title,
                    start: e.date + (e.time ? 'T' + e.time : ''),
                    extendedProps: { status: e.status, notes: e.notes }
                }));
                successCallback(events);
            } catch (err) {
                console.error('Fetch error:', err);
                failureCallback(err);
            }
        }

        function openModal(event, dateStr) {
            const modal = document.getElementById('eventModal');
            const deleteBtn = document.getElementById('deleteBtn');
            const title = document.getElementById('modalTitle');

            if (event && event.id) {
                // Edit mode
                editingEventId = event.id;
                title.textContent = '✏️ Tahrirlash';
                document.getElementById('eventTitle').value = event.title;
                document.getElementById('eventDate').value = event.startStr.split('T')[0];
                document.getElementById('eventTime').value = event.startStr.includes('T') ? event.startStr.split('T')[1].substring(0,5) : '19:00';
                document.getElementById('eventStatus').value = event.extendedProps.status || 'planned';
                document.getElementById('eventNotes').value = event.extendedProps.notes || '';
                deleteBtn.style.display = 'block';
            } else {
                // New event
                editingEventId = null;
                title.textContent = '📅 Yangi Event';
                document.getElementById('eventTitle').value = '';
                document.getElementById('eventDate').value = dateStr || new Date().toISOString().split('T')[0];
                document.getElementById('eventTime').value = '19:00';
                document.getElementById('eventStatus').value = 'planned';
                document.getElementById('eventNotes').value = '';
                deleteBtn.style.display = 'none';
            }
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('eventModal').classList.remove('active');
            editingEventId = null;
        }

        async function saveEvent() {
            const payload = {
                title: document.getElementById('eventTitle').value,
                date: document.getElementById('eventDate').value,
                time: document.getElementById('eventTime').value,
                status: document.getElementById('eventStatus').value,
                notes: document.getElementById('eventNotes').value,
            };

            if (!payload.title || !payload.date) {
                alert('Sarlavha va sana kerak!');
                return;
            }

            try {
                let url, method;
                if (editingEventId) {
                    url = API_BASE + '/api/calendar/event/' + editingEventId;
                    method = 'PUT';
                } else {
                    url = API_BASE + '/api/calendar/event';
                    method = 'POST';
                }

                const res = await fetch(url, {
                    method: method,
                    headers: headers(),
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    closeModal();
                    calendar.refetchEvents();
                } else {
                    alert('Xato yuz berdi');
                }
            } catch (err) {
                alert('Server xatosi: ' + err.message);
            }
        }

        async function deleteEvent() {
            if (!editingEventId) return;
            if (!confirm('Rostdan o\'chirmoqchimisiz?')) return;

            try {
                const res = await fetch(API_BASE + '/api/calendar/event/' + editingEventId, {
                    method: 'DELETE',
                    headers: headers()
                });
                if (res.ok) {
                    closeModal();
                    calendar.refetchEvents();
                }
            } catch (err) {
                alert('Xato: ' + err.message);
            }
        }
    </script>
</body>
</html>
