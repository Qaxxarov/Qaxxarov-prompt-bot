<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro AI — Dashboard</title>
    <style>
        :root{--bg:#0f1117;--surface:#1a1d27;--surface2:#242836;--border:#2d3348;--text:#e4e7f0;--text2:#8b92a8;--accent:#6366f1;--accent2:#818cf8;--green:#10b981;--red:#ef4444;--yellow:#f59e0b;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.3)}
        [data-theme="light"]{--bg:#f8fafc;--surface:#fff;--surface2:#f1f5f9;--border:#e2e8f0;--text:#1e293b;--text2:#64748b;--shadow:0 4px 24px rgba(0,0,0,.08)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
        .app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
        .sidebar{background:var(--surface);border-right:1px solid var(--border);padding:24px 16px;display:flex;flex-direction:column;gap:8px;position:sticky;top:0;height:100vh;overflow-y:auto}
        .logo{font-size:20px;font-weight:700;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
        .logo span{color:var(--accent)}
        .nav-item{padding:10px 16px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text2);transition:.2s}
        .nav-item:hover,.nav-item.active{background:var(--surface2);color:var(--text)}
        .nav-item.active{border-left:3px solid var(--accent);font-weight:600}
        .main{padding:32px;overflow-y:auto}
        .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}
        .header h1{font-size:24px;font-weight:700}
        .theme-toggle{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 16px;cursor:pointer;color:var(--text);font-size:13px}
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:32px}
        .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
        .card-title{font-size:12px;text-transform:uppercase;color:var(--text2);margin-bottom:8px;letter-spacing:.5px}
        .card-value{font-size:28px;font-weight:700}
        .card-sub{font-size:12px;color:var(--text2);margin-top:4px}
        .score-bar{height:8px;background:var(--surface2);border-radius:4px;margin-top:8px;overflow:hidden}
        .score-fill{height:100%;border-radius:4px;transition:width .5s}
        .green{color:var(--green)}.red{color:var(--red)}.yellow{color:var(--yellow)}.accent{color:var(--accent)}
        .section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:24px}
        .section h2{font-size:18px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
        .list-item{padding:12px;border-bottom:1px solid var(--border);font-size:14px;display:flex;justify-content:space-between}
        .list-item:last-child{border-bottom:none}
        .badge{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
        .badge-green{background:#10b98120;color:var(--green)}
        .badge-red{background:#ef444420;color:var(--red)}
        .badge-yellow{background:#f59e0b20;color:var(--yellow)}
        .login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}
        .login-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:40px;width:360px;text-align:center}
        .login-box h2{margin-bottom:24px}
        .login-box input{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text);font-size:14px;margin-bottom:16px}
        .btn{width:100%;padding:12px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
        .btn:hover{background:var(--accent2)}
        .status-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
        .status-online{background:var(--green)}
        .status-offline{background:var(--red)}
        .hidden{display:none}
        @media(max-width:768px){.app{grid-template-columns:1fr}.sidebar{display:none}}
    </style>
</head>
<body>
    <!-- LOGIN -->
    <div id="login-page" class="login-page">
        <div class="login-box">
            <h2>🌿 Agro AI</h2>
            <p style="color:var(--text2);margin-bottom:24px">Dashboard kirish</p>
            <input type="password" id="password" placeholder="Parol kiriting" onkeypress="if(event.key==='Enter')login()">
            <button class="btn" onclick="login()">Kirish</button>
            <p id="login-error" style="color:var(--red);margin-top:12px;font-size:13px" class="hidden"></p>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="app hidden">
        <aside class="sidebar">
            <div class="logo">🌿 <span>Agro AI</span></div>
            <div class="nav-item active" data-page="overview">📊 Overview</div>
            <div class="nav-item" data-page="analytics">📈 Analytics</div>
            <div class="nav-item" data-page="ai">🤖 AI Center</div>
            <div class="nav-item" data-page="memory">🧠 Memory</div>
            <div class="nav-item" data-page="ops">📋 Ops Manager</div>
            <div class="nav-item" data-page="exports">📤 Exports</div>
            <div class="nav-item" data-page="settings">⚙️ Settings</div>
            <div style="margin-top:auto;padding:12px;font-size:12px;color:var(--text2)">
                <span class="status-dot status-online"></span> Tizim faol
            </div>
        </aside>
        <main class="main" id="content">
            <div class="header">
                <h1 id="page-title">📊 Overview</h1>
                <button class="theme-toggle" onclick="toggleTheme()">🌙 Tema</button>
            </div>
            <div id="page-content">Yuklanmoqda...</div>
        </main>
    </div>

    <script>
    let TOKEN = localStorage.getItem('agro_token') || '';
    const API = '';

    // ── AUTH ──
    async function login() {
        const pw = document.getElementById('password').value;
        try {
            const r = await fetch(API+'/api/auth/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:pw})});
            const d = await r.json();
            if(r.ok){TOKEN=d.token; localStorage.setItem('agro_token',TOKEN); showDashboard();}
            else{document.getElementById('login-error').textContent=d.detail; document.getElementById('login-error').classList.remove('hidden');}
        }catch(e){document.getElementById('login-error').textContent='Server bilan aloqa yo\'q'; document.getElementById('login-error').classList.remove('hidden');}
    }

    function showDashboard(){document.getElementById('login-page').classList.add('hidden'); document.getElementById('dashboard').classList.remove('hidden'); loadPage('overview');}
    function showLogin(){document.getElementById('login-page').classList.remove('hidden'); document.getElementById('dashboard').classList.add('hidden');}

    async function api(path, opts={}){
        const r = await fetch(API+path, {...opts, headers:{...opts.headers, 'Authorization':'Bearer '+TOKEN, 'Content-Type':'application/json'}});
        if(r.status===401){showLogin(); return null;}
        return await r.json();
    }

    // ── NAVIGATION ──
    document.querySelectorAll('.nav-item').forEach(el=>{
        el.addEventListener('click',()=>{
            document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
            el.classList.add('active');
            loadPage(el.dataset.page);
        });
    });

    async function loadPage(page){
        document.getElementById('page-title').textContent = {overview:'📊 Overview',analytics:'📈 Analytics',ai:'🤖 AI Center',memory:'🧠 Memory',ops:'📋 Ops Manager',exports:'📤 Exports',settings:'⚙️ Settings'}[page]||page;
        const c = document.getElementById('page-content');
        c.innerHTML = '<p style="color:var(--text2)">Yuklanmoqda...</p>';
        try{
            if(page==='overview') await renderOverview(c);
            else if(page==='analytics') await renderAnalytics(c);
            else if(page==='memory') await renderMemory(c);
            else if(page==='ops') await renderOps(c);
            else if(page==='exports') await renderExports(c);
            else if(page==='ai') renderAI(c);
            else if(page==='settings') await renderSettings(c);
        }catch(e){c.innerHTML=`<p style="color:var(--red)">Xato: ${e.message}</p>`;}
    }

    // ── OVERVIEW ──
    async function renderOverview(c){
        const d = await api('/api/overview');
        if(!d)return;
        const s=d.state, disc=d.discipline, tr=d.trend;
        const streakColor = s.posting_streak>=7?'green':s.posting_streak>=3?'yellow':'red';
        const erColor = s.avg_er>=3?'green':s.avg_er>=1?'yellow':'red';
        c.innerHTML = `
        <div class="grid">
            <div class="card"><div class="card-title">Followers</div><div class="card-value">${s.followers.toLocaleString()}</div><div class="card-sub">${tr.follower_change>=0?'+':''}${tr.follower_change} (7 kun)</div></div>
            <div class="card"><div class="card-title">O'rtacha Views</div><div class="card-value">${s.avg_views.toLocaleString()}</div><div class="card-sub">Max: ${s.max_views.toLocaleString()}</div></div>
            <div class="card"><div class="card-title">Engagement Rate</div><div class="card-value ${erColor}">${s.avg_er}%</div><div class="card-sub">Viral: ${s.viral_count} ta reel</div></div>
            <div class="card"><div class="card-title">Posting Streak</div><div class="card-value ${streakColor}">${s.posting_streak} kun</div><div class="card-sub">${s.posted_today?'✅ Bugun post qilindi':'❌ Bugun hali yoq'}</div></div>
        </div>
        <div class="grid" style="grid-template-columns:1fr 1fr">
            <div class="card"><div class="card-title">Intizom Score</div><div class="card-value">${disc.score}/100</div><div class="score-bar"><div class="score-fill" style="width:${disc.score}%;background:${disc.score>=70?'var(--green)':disc.score>=40?'var(--yellow)':'var(--red)'}"></div></div><div class="card-sub">${disc.grade}</div></div>
            <div class="card"><div class="card-title">Tizim Holati</div><div class="card-value" style="font-size:16px">${d.system.issues.length===0?'<span class="green">✅ Barcha tekshiruvlar o\'tdi</span>':'<span class="red">⚠️ '+d.system.issues.length+' ta muammo</span>'}</div><div class="card-sub">AI: ${d.system.ai_enabled?'✅ '+d.system.ai_model:'❌ off'} | Profil: ${d.system.chrome_profile}</div></div>
        </div>
        <div class="section"><h2>📊 Oxirgi skan</h2><p style="color:var(--text2)">${s.is_stale?'⚠️ Ma\'lumot eskirgan ('+s.last_scan_hours_ago.toFixed(1)+' soat oldin)':'✅ Yangi ('+s.last_scan_hours_ago.toFixed(1)+' soat oldin)'}</p></div>`;
    }

    // ── ANALYTICS ──
    async function renderAnalytics(c){
        const d = await api('/api/analytics');
        if(!d)return;
        let reelsHtml = d.recent_reels.map((r,i)=>`<div class="list-item"><span>#${i+1} ${r.caption||'—'}</span><span>👁${r.views.toLocaleString()} | ❤️${r.likes} | 📈${r.er}%</span></div>`).join('');
        let histHtml = d.history.slice(-7).map(h=>`<div class="list-item"><span>${h.date}</span><span>${h.posted_today?'✅':'❌'} | 👥${h.followers?.toLocaleString()||'?'}</span></div>`).join('');
        c.innerHTML = `
        <div class="grid"><div class="card"><div class="card-title">Followers</div><div class="card-value">${d.current.followers.toLocaleString()}</div></div><div class="card"><div class="card-title">O'rtacha Views</div><div class="card-value">${d.current.avg_views.toLocaleString()}</div></div><div class="card"><div class="card-title">ER</div><div class="card-value">${d.current.avg_er}%</div></div></div>
        <div class="section"><h2>🎬 Oxirgi Reels</h2>${reelsHtml||'<p>Ma\'lumot yo\'q</p>'}</div>
        <div class="section"><h2>📅 7 Kunlik Tarix</h2>${histHtml||'<p>Tarix yo\'q</p>'}</div>`;
    }

    // ── MEMORY ──
    async function renderMemory(c){
        const d = await api('/api/memory');
        if(!d)return;
        let hooksHtml = d.top_hooks.map((h,i)=>`<div class="list-item"><span>${i+1}. ${h.content}</span><span class="badge badge-green">⭐${h.score}</span></div>`).join('');
        c.innerHTML = `
        <div class="grid"><div class="card"><div class="card-title">Jami Yozuvlar</div><div class="card-value">${d.stats.total}</div></div><div class="card"><div class="card-title">O'rtacha Ball</div><div class="card-value">${d.stats.avg_score}/10</div></div></div>
        <div class="section"><h2>🎣 Top Hooklar</h2>${hooksHtml||'<p>Hali hook saqlanmagan</p>'}</div>`;
    }

    // ── OPS ──
    async function renderOps(c){
        const d = await api('/api/ops/status');
        if(!d)return;
        c.innerHTML = `<div class="section"><h2>📋 Tezkor Holat</h2><pre style="white-space:pre-wrap;font-size:13px;color:var(--text2)">${d.status.replace(/\*/g,'')}</pre></div>
        <div class="grid"><div class="card" style="cursor:pointer" onclick="triggerOps('morning')"><div class="card-title">🌅 Ertalabki Brifing</div><div class="card-sub">Bosing</div></div><div class="card" style="cursor:pointer" onclick="triggerOps('evening')"><div class="card-title">🌙 Kechki Hisobot</div><div class="card-sub">Bosing (skan qiladi)</div></div></div>
        <div id="ops-result"></div>`;
    }
    async function triggerOps(type){
        document.getElementById('ops-result').innerHTML='<p>⏳ Yuklanmoqda...</p>';
        const d = await api('/api/ops/'+type, {method:'POST'});
        if(d) document.getElementById('ops-result').innerHTML=`<div class="section"><pre style="white-space:pre-wrap;font-size:13px">${(d.briefing||d.report||'').replace(/\*/g,'')}</pre></div>`;
    }

    // ── EXPORTS ──
    async function renderExports(c){
        const d = await api('/api/exports');
        if(!d)return;
        let filesHtml = d.files.map(f=>`<div class="list-item"><span>${f.name}</span><span><a href="/api/exports/download/${f.name}" style="color:var(--accent)">⬇️ Yuklab olish</a></span></div>`).join('');
        c.innerHTML = `<div class="section"><h2>📁 Fayllar</h2>${filesHtml||'<p>Fayl yo\'q</p>'}</div>`;
    }

    // ── AI CENTER ──
    function renderAI(c){
        c.innerHTML = `
        <div class="grid">
            <div class="card" style="cursor:pointer" onclick="runAI('hooks','viral')"><div class="card-title">🎣 Hook Engine</div><div class="card-sub">Viral hooklar yaratish</div></div>
            <div class="card" style="cursor:pointer" onclick="runAI('storytelling','transformation')"><div class="card-title">🎭 Storytelling</div><div class="card-sub">Ssenariy yaratish</div></div>
            <div class="card" style="cursor:pointer" onclick="runAI('veo','golden_harvest')"><div class="card-title">🎞 Veo Engine</div><div class="card-sub">Video prompt</div></div>
            <div class="card" style="cursor:pointer" onclick="runAI('audience','')"><div class="card-title">🧠 Audience AI</div><div class="card-sub">Auditoriya tahlili</div></div>
        </div>
        <div id="ai-result"></div>`;
    }
    async function runAI(engine, param){
        document.getElementById('ai-result').innerHTML='<div class="section"><p>⏳ AI ishlayapti...</p></div>';
        const d = await api('/api/ai/generate',{method:'POST',body:JSON.stringify({engine,action:param,params:{category:param,scene:param,arc:param}})});
        if(d) document.getElementById('ai-result').innerHTML=`<div class="section"><h2>🤖 ${engine}</h2><pre style="white-space:pre-wrap;font-size:13px">${d.result}</pre></div>`;
    }

    // ── SETTINGS ──
    async function renderSettings(c){
        const d = await api('/api/accounts');
        if(!d)return;
        let accsHtml = d.accounts.map(a=>`<div class="list-item"><span>${a.id===d.active?'✅':'⬜'} ${a.instagram}</span><span>${a.niche.slice(0,30)}</span></div>`).join('');
        c.innerHTML = `<div class="section"><h2>👥 Akkauntlar</h2>${accsHtml}</div><div class="section"><button class="btn" onclick="localStorage.removeItem('agro_token');showLogin()">🚪 Chiqish</button></div>`;
    }

    // ── THEME ──
    function toggleTheme(){
        const html=document.documentElement;
        html.dataset.theme = html.dataset.theme==='dark'?'light':'dark';
        localStorage.setItem('theme', html.dataset.theme);
    }
    if(localStorage.getItem('theme')) document.documentElement.dataset.theme=localStorage.getItem('theme');

    // ── INIT ──
    if(TOKEN) showDashboard(); else showLogin();
    </script>
</body>
</html>
